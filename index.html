    <main class="main">

    <button class="tab" data-tab="buscar" id="tab-buscar" type="button"><span class="tab-icon">🔍</span><span class="tab-label">Buscar</span></button>

  <script>
/* ============================================================
   Sonicyt — Núcleo modular (cascarón)
   Este archivo NO conoce proveedores. Solo:
     1. Inyecta dinámicamente los conectores de extensions/.
     2. Pinta los resultados con la interfaz de vidrio.
     3. Reproduce y hace el swap al audio completo si un
        conector con capacidad "resolve" responde a tiempo.

   Contrato de extensión (estilo .sflx):
     window.SonicytExtensions['id'] = {
       id, nombre, version, orden,
       capacidades: ['search' | 'resolve'],
       search(consulta, { limit, quality }) -> Promise<pista[]>,
       resolve(pista, { timeoutMs }) -> Promise<url>,
       generos, catalogos   // opcionales, para la interfaz
     }
   ============================================================ */

const RUTA_EXTENSIONES = [
  'extensions/itunes-bridge.js',
  'extensions/youtube-bridge.js'
];

const TIEMPO_FUSION_MS = 8000; // la fusión corre en segundo plano: el preview suena al instante
const GENEROS_RESPALDO = ['Pop', 'Rock', 'Electronic', 'Lofi', 'Jazz', 'Hip-Hop', 'Salsa', 'Metal', 'Clásica'];
const HIST_KEY = 'sonicyt-historial-v7';
const HIST_KEY_LEGACY = 'sonicyt-historial-v6';

// Registro global compartido con los conectores
window.SonicytExtensions = window.SonicytExtensions || {};

// ---------- Modelo DOM ----------
let searchInput, searchBtn, resultsEl;
let audio, playerBar, playerThumb, playerTitle, playerArtist, btnPlayPause;
let nowPlaying, npBackdrop, npArt, npTitle, npArtist, npBadge, npProgress, npTimeCur, npTimeDur;
let btnNpPrev, btnNpPlay, btnNpNext, btnNpDownload, btnNpDownloadText, npDownloadStatus, npVol, btnNpClose;
let btnConfig, configPanel, btnCloseConfig, q128Btn, q256Btn;
let tabBar, carouselNow, gridAlbums, chipsEl, exploreGrid, exploreMsg, biblioGrid, biblioMsg, btnClearHistory;
let extStatus;

// Reproductor HLS (SoundCloud entrega audio completo en HLS)
let hlsActivo = null;
let cargadorHls = null;
let tokenStream = 0;

let currentSong = null;
let quality = localStorage.getItem('sonicyt-quality') || '256';
let inicioCargado = false;
let generoActivo = null;
let promesaExtensiones = null;

const SVG_PLAY = '<svg viewBox="0 0 24 24" fill="currentColor" width="26" height="26"><path d="M8 5v14l11-7z"/></svg>';
const SVG_PAUSE = '<svg viewBox="0 0 24 24" fill="currentColor" width="26" height="26"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';

function $id(id) { return document.getElementById(id); }

function obtenerElementos() {
  searchInput = $id('search');
  searchBtn = $id('search-btn');
  resultsEl = $id('results');

  audio = new Audio();
  audio.preload = 'auto';

  playerBar = $id('playerBar');
  playerThumb = $id('playerThumb');
  playerTitle = $id('playerTitle');
  playerArtist = $id('playerArtist');
  btnPlayPause = $id('btnPlayPause');

  nowPlaying = $id('nowPlaying');
  npBackdrop = $id('npBackdrop');
  npArt = $id('npArt');
  npTitle = $id('npTitle');
  npArtist = $id('npArtist');
  npBadge = $id('npBadge');
  npProgress = $id('npProgress');
  npTimeCur = $id('npTimeCur');
  npTimeDur = $id('npTimeDur');
  btnNpPrev = $id('btnNpPrev');
  btnNpPlay = $id('btnNpPlay');
  btnNpNext = $id('btnNpNext');
  btnNpDownload = $id('btnNpDownload');
  btnNpDownloadText = $id('btnNpDownloadText');
  npDownloadStatus = $id('npDownloadStatus');
  npVol = $id('npVol');
  btnNpClose = $id('btnNpClose');

  btnConfig = $id('btnConfig');
  configPanel = $id('configPanel');
  btnCloseConfig = $id('btnCloseConfig');
  q128Btn = $id('q128');
  q256Btn = $id('q256');

  tabBar = $id('tabBar');
  carouselNow = $id('carouselNow');
  gridAlbums = $id('gridAlbums');
  chipsEl = $id('chips');
  exploreGrid = $id('exploreGrid');
  exploreMsg = $id('exploreMsg');
  biblioGrid = $id('biblioGrid');
  biblioMsg = $id('biblioMsg');
  btnClearHistory = $id('btnClearHistory');
  extStatus = $id('extStatus');
}

// ---------- Utilidades ----------
function fmtTime(seconds) {
  if (!seconds || isNaN(seconds)) return '0:00';
  const m = Math.floor(seconds / 60);
  const s = Math.floor(seconds % 60);
  return m + ':' + (s < 10 ? '0' : '') + s;
}

function escapeHtml(text) {
  if (!text) return '';
  const d = document.createElement('div');
  d.textContent = text;
  return d.innerHTML;
}

function setEstado(el, mensaje, esError) {
  if (!el) return;
  el.innerHTML = '';
  const p = document.createElement('p');
  p.style.textAlign = 'center';
  p.style.marginTop = '36px';
  p.style.fontSize = '15px';
  p.style.color = esError ? '#ff6b6b' : 'rgba(255,255,255,0.62)';
  p.textContent = mensaje;
  el.appendChild(p);
}

function iconName(btn, name) {
  if (!btn) return;
  btn.innerHTML = (name === 'pause') ? SVG_PAUSE : SVG_PLAY;
}

function sanearNombre(texto) {
  return (texto || 'Audio').replace(/[\\/:*?"<>|]/g, '').slice(0, 100);
}

function placeholderArt() {
  return 'data:image/svg+xml;utf8,' + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300"><rect width="300" height="300" fill="#161622"/><text x="150" y="178" font-size="72" text-anchor="middle" fill="#1DB954" font-family="sans-serif">&#9834;</text></svg>'
  );
}

// ============================================================
// 1. CARGA DINÁMICA DE EXTENSIONES
// ============================================================
function inyectarScript(ruta) {
  return new Promise(function (resolve, reject) {
    const tag = document.createElement('script');
    tag.src = ruta;
    tag.async = false;
    tag.onload = function () { resolve(ruta); };
    tag.onerror = function () { reject(new Error('No se pudo cargar ' + ruta)); };
    document.head.appendChild(tag);
  });
}

async function cargarExtensiones() {
  const cargadas = [];
  const fallos = [];

  for (let i = 0; i < RUTA_EXTENSIONES.length; i++) {
    const ruta = RUTA_EXTENSIONES[i];
    try {
      await inyectarScript(ruta);
      cargadas.push(ruta);
    } catch (err) {
      fallos.push({ ruta: ruta, error: err.message });
      console.warn('[Sonicyt]', err.message);
    }
  }

  actualizarEstadoExtensiones(cargadas, fallos);
  return { cargadas: cargadas, fallos: fallos };
}

function actualizarEstadoExtensiones(cargadas, fallos) {
  if (!extStatus) return;
  const extensiones = listarExtensiones();
  const nombres = extensiones.map(function (e) { return e.nombre; });

  if (extensiones.length === 0) {
    extStatus.className = 'ext-status error';
    extStatus.textContent = 'Sin extensiones activas. Revisa extensions/ o la conexión.';
    return;
  }

  if (fallos.length > 0) {
    extStatus.className = 'ext-status aviso';
    extStatus.textContent = 'Extensiones activas: ' + nombres.join(' · ') +
      ' — falló: ' + fallos.map(function (f) { return f.ruta; }).join(', ');
    return;
  }

  extStatus.className = 'ext-status';
  extStatus.textContent = '✓ ' + extensiones.length + ' extensiones cargadas: ' + nombres.join(' · ');
}

function listarExtensiones() {
  const contenedor = window.SonicytExtensions || {};
  const ids = Object.keys(contenedor);
  const lista = [];

  for (let i = 0; i < ids.length; i++) {
    const ext = contenedor[ids[i]];
    if (ext && ext.id && ext.capacidades && ext.capacidades.length) {
      lista.push(ext);
    }
  }

  lista.sort(function (a, b) { return (a.orden || 100) - (b.orden || 100); });
  return lista;
}

function extensionesCon(capacidad) {
  const todas = listarExtensiones();
  const filtradas = [];
  for (let i = 0; i < todas.length; i++) {
    if (todas[i].capacidades.indexOf(capacidad) !== -1) filtradas.push(todas[i]);
  }
  return filtradas;
}

function primeroCon(capacidad) {
  const lista = extensionesCon(capacidad);
  return lista.length ? lista[0] : null;
}

async function asegurarExtensiones() {
  if (promesaExtensiones) await promesaExtensiones;
}

// Envuelve una promesa para no romper Promise.all si un conector falla
function aResultado(promesa) {
  return Promise.resolve(promesa).then(
    function (valor) { return { ok: true, valor: valor }; },
    function (error) { return { ok: false, error: error || new Error('Error desconocido') }; }
  );
}

function deduplicar(items) {
  const vistos = {};
  const salida = [];

  for (let i = 0; i < items.length; i++) {
    const it = items[i];
    if (!it || !it.id || vistos[it.id]) continue;
    vistos[it.id] = true;
    salida.push(it);
  }

  salida.sort(function (a, b) { return (b.prioridad || 0) - (a.prioridad || 0); });
  return salida;
}

// ============================================================
// 2. CONSULTA A LAS EXTENSIONES
// ============================================================
async function buscarEnExtensiones(consulta, limite) {
  const buscadores = extensionesCon('search');
  if (buscadores.length === 0) {
    throw new Error('No hay extensiones de búsqueda cargadas');
  }

  const opciones = { limit: limite || 20, quality: quality };
  const promesas = buscadores.map(function (ext) {
    return aResultado(ext.search(consulta, opciones)).then(function (resultado) {
      return { ext: ext, resultado: resultado };
    });
  });

  const settled = await Promise.all(promesas);
  let items = [];
  const fuentes = [];

  for (let i = 0; i < settled.length; i++) {
    const ext = settled[i].ext;
    const r = settled[i].resultado;

    if (r.ok && r.valor && r.valor.length) {
      items = items.concat(r.valor);
      fuentes.push(ext.nombre);
    } else if (!r.ok) {
      console.warn('[Sonicyt] ' + ext.nombre + ':', r.error.message);
    }
  }

  return { items: deduplicar(items), fuentes: fuentes };
}

function cancelarFusion() {
  const puente = primeroCon('resolve');
  if (puente && typeof puente.cancelar === 'function') {
    puente.cancelar();
  }
}

// Fusión AUTOMÁTICA: pide audio completo al conector "resolve" con ventana propia.
// Se dispara al tocar la pista; el usuario no tiene que activar nada.
function fusionCancionCompleta(item) {
  const puente = primeroCon('resolve');
  if (!puente || typeof puente.resolve !== 'function') return Promise.resolve(null);

  const pista = {
    artist: item.artist_name || item.artist || item.author || '',
    title: item.name || item.title || '',
    videoId: item.videoId || null
  };

  return aResultado(puente.resolve(pista, { timeoutMs: TIEMPO_FUSION_MS })).then(function (r) {
    return (r.ok && r.valor) ? r.valor : null;
  });
}

// ============================================================
// 3. HISTORIAL (Biblioteca) — guarda SIEMPRE la imagen completa
// ============================================================
function normalizarEntradaHistorial(it) {
  const imagen = it.image || it.thumb || '';
  return {
    id: it.id,
    name: it.name || it.title || 'Sin título',
    artist_name: it.artist_name || it.artist || 'Artista desconocido',
    image: imagen,
    thumb: imagen,
    url: it.url || it.audio || null,
    completa: it.completa === true,
    fuente: it.fuente || 'historial'
  };
}

function cargarHistorial() {
  try {
    let crudo = localStorage.getItem(HIST_KEY);
    let migrado = false;

    if (!crudo) {
      crudo = localStorage.getItem(HIST_KEY_LEGACY);
      migrado = !!crudo;
    }

    const lista = JSON.parse(crudo || '[]');
    if (!Array.isArray(lista)) return [];

    // Normaliza también las entradas antiguas (solo tenían "thumb")
    const normalizada = lista
      .map(normalizarEntradaHistorial)
      .filter(function (it) { return !!it.id; });

    if (migrado) {
      localStorage.setItem(HIST_KEY, JSON.stringify(normalizada));
      localStorage.removeItem(HIST_KEY_LEGACY);
    }

    return normalizada;
  } catch (e) {
    return [];
  }
}

function agregarAHistorial(song) {
  const entrada = normalizarEntradaHistorial({
    id: song.id,
    name: song.title,
    artist_name: song.artist,
    image: song.thumb || song.image,
    url: song.url,
    completa: song.completa,
    fuente: song.fuente
  });

  if (!entrada.id || !entrada.url) return;

  let hist = cargarHistorial().filter(function (t) { return t.id !== entrada.id; });
  hist.unshift(entrada);
  hist = hist.slice(0, 50);

  try {
    localStorage.setItem(HIST_KEY, JSON.stringify(hist));
  } catch (e) {
    console.warn('[Sonicyt] Historial no disponible:', e.message);
  }
}

// ============================================================
// 4. REPRODUCTOR
// ============================================================
function actualizacionBadge() {
  if (!currentSong) return;
  if (currentSong.completa) {
    npBadge.textContent = '● PISTA COMPLETA · MP3';
    npBadge.style.display = 'block';
    btnNpDownloadText.textContent = 'Descargar audio completo';
  } else {
    npBadge.textContent = '● PREVIEW · 30 s';
    npBadge.style.display = 'block';
    btnNpDownloadText.textContent = 'Descargar preview';
  }
}

function reproducirPreview(item) {
  currentSong = {
    id: item.id || ('tmp-' + Math.floor(Math.random() * 1e10)),
    title: item.name || item.title || 'Sin título',
    artist: item.artist_name || item.artist || item.author || 'Artista desconocido',
    thumb: item.image || item.thumb || '',
    url: item.audio || item.url || null,
    // Historial sin campo audio: la URL guardada ya es la pista resuelta
    completa: !item.audio && item.completa === true,
    fuente: item.fuente || 'historial'
  };

  // Un nuevo toque cancela cualquier carga HLS en curso y vuelve al preview
  tokenStream += 1;
  detenerHls();

  // Un .m3u8 guardado en el historial no se reproduce directo en Android:
  // se deja que la fusión resuelva un stream fresco (con hls.js si hace falta)
  if (currentSong.url && esUrlHls(currentSong.url) && !hlsNativoDisponible()) {
    npDownloadStatus.textContent = 'Buscando audio completo…';
  } else {
    audio.src = currentSong.url;
    audio.play().catch(function () { /* autoplay bloqueado */ });
  }

  actualizarReproductorMini();
  abrirNowPlaying();
  agregarAHistorial(currentSong);
}

async function cargarCancion(item) {
  if (!item || !(item.audio || item.videoId || item.url)) {
    setEstado(resultsEl, 'Esta tarjeta no tiene audio reproducible.', false);
    return;
  }

  cancelarFusion();

  // El toque dispara la fusión de inmediato, automática y en segundo plano
  const fusion = fusionCancionCompleta(item);

  // 1) Suena al instante el preview de iTunes (nunca bloquea al usuario)
  reproducirPreview(item);
  const idEnReproduccion = currentSong.id;
  npDownloadStatus.textContent = 'Fusionando audio completo en segundo plano…';

  // 2) Si el conector responde en su ventana, swap continuo sin cortes
  fusion.then(function (urlCompleto) {
    if (!currentSong || currentSong.id !== idEnReproduccion) return;

    if (!urlCompleto) {
      npDownloadStatus.textContent = 'Audio completo no disponible · sigue el preview';
      return;
    }

    cambiarStreamSinCortes(urlCompleto);
  }).catch(function () {
    if (currentSong && currentSong.id === idEnReproduccion) {
      npDownloadStatus.textContent = 'Audio completo no disponible · sigue el preview';
    }
  });
}

function esUrlHls(url) {
  return String(url || '').toLowerCase().indexOf('.m3u8') !== -1;
}

function hlsNativoDisponible() {
  try { return !!audio.canPlayType('application/vnd.apple.mpegurl'); } catch (e) { return false; }
}

function detenerHls() {
  if (hlsActivo) {
    try { hlsActivo.destroy(); } catch (e) { /* ya destruido */ }
    hlsActivo = null;
  }
}

// hls.js solo se descarga la primera vez que hace falta (audio HLS en Android)
function cargarHlsJs() {
  if (window.Hls && window.Hls.isSupported()) return Promise.resolve(window.Hls);
  if (cargadorHls) return cargadorHls;

  cargadorHls = new Promise(function (resolve, reject) {
    const script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.light.min.js';
    script.async = true;
    script.onload = function () {
      cargadorHls = null;
      if (window.Hls && window.Hls.isSupported()) resolve(window.Hls);
      else reject(new Error('hls.js no soportado'));
    };
    script.onerror = function () {
      cargadorHls = null;
      reject(new Error('No se pudo cargar hls.js'));
    };
    document.head.appendChild(script);
  });

  return cargadorHls;
}

function cambiarStreamSinCortes(urlCompleto) {
  const posicion = audio.currentTime || 0;
  const estabaSonando = !audio.paused;
  tokenStream += 1;
  const miToken = tokenStream;

  function finalizarCambio() {
    currentSong.url = urlCompleto;
    currentSong.completa = true;
    actualizacionBadge();
    agregarAHistorial(currentSong);
    npDownloadStatus.textContent = 'Audio completo cargado sin cortes ✔';
  }

  function restaurarPosicion() {
    try { audio.currentTime = posicion; } catch (e) { /* algunos navegadores */ }
    if (estabaSonando) audio.play().catch(function () {});
  }

  // HLS nativo (iOS/Safari): el propio <audio> entiende el .m3u8
  if (!esUrlHls(urlCompleto) || hlsNativoDisponible()) {
    detenerHls();
    audio.src = urlCompleto;
    audio.addEventListener('loadedmetadata', function alCargar() {
      restaurarPosicion();
      audio.removeEventListener('loadedmetadata', alCargar);
    });
    if (estabaSonando) audio.play().catch(function () {});
    finalizarCambio();
    return;
  }

  // Android/Chrome: HLS por MSE con hls.js (el CDN de SoundCloud abre CORS)
  npDownloadStatus.textContent = 'Preparando audio completo…';
  cargarHlsJs().then(function (Hls) {
    if (miToken !== tokenStream || !currentSong) return;
    detenerHls();

    const hls = new Hls({ enableWorker: true });
    hlsActivo = hls;

    hls.on(Hls.Events.MANIFEST_PARSED, function () {
      if (miToken !== tokenStream) return;
      restaurarPosicion();
      finalizarCambio();
    });

    hls.on(Hls.Events.ERROR, function (evento, dato) {
      if (!dato || !dato.fatal) return;
      detenerHls();
      if (miToken === tokenStream) {
        npDownloadStatus.textContent = 'Audio completo no disponible · sigue el preview';
      }
    });

    hls.loadSource(urlCompleto);
    hls.attachMedia(audio);
  }).catch(function () {
    if (miToken === tokenStream && currentSong) {
      npDownloadStatus.textContent = 'Audio completo no disponible · sigue el preview';
    }
  });
}

function actualizarReproductorMini() {
  if (!currentSong) return;
  playerBar.style.display = 'flex';
  playerThumb.src = currentSong.thumb || placeholderArt();
  playerTitle.textContent = currentSong.title;
  playerArtist.textContent = currentSong.artist;
  refreshPlayIcons();
}

function refreshPlayIcons() {
  const ico = audio.paused ? 'play' : 'pause';
  iconName(btnPlayPause, ico);
  iconName(btnNpPlay, ico);
}

function abrirNowPlaying() {
  if (!currentSong) return;
  npBackdrop.src = currentSong.thumb || placeholderArt();
  npArt.src = currentSong.thumb || placeholderArt();
  npTitle.textContent = currentSong.title;
  npArtist.textContent = currentSong.artist;
  nowPlaying.style.display = 'flex';
  npDownloadStatus.textContent = '';
  actualizacionBadge();
  refreshPlayIcons();
}

function cerrarNowPlaying() {
  nowPlaying.style.display = 'none';
}

// ---------- Descarga nativa ----------
async function descargarCancion() {
  if (!currentSong || !currentSong.url) return;
  npDownloadStatus.textContent = 'Descargando…';

  try {
    const res = await fetch(currentSong.url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const blob = await res.blob();

    const ext = (currentSong.completa)
      ? 'mp3'
      : ((blob.type && blob.type.indexOf('mpeg') !== -1) ? 'mp3' : 'm4a');
    const nombre = sanearNombre(currentSong.artist + ' - ' + currentSong.title) + '.' + ext;
    const urlBlob = URL.createObjectURL(blob);

    const a = document.createElement('a');
    a.href = urlBlob;
    a.download = nombre;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(urlBlob); }, 4000);

    npDownloadStatus.textContent = 'Guardado en tu carpeta de Descargas ✔ (' + Math.round(blob.size / 1024) + ' KB)';
  } catch (err) {
    npDownloadStatus.textContent = 'Descarga nativa abierta…';
    const a2 = document.createElement('a');
    a2.href = currentSong.url;
    a2.target = '_blank';
    a2.rel = 'noopener';
    document.body.appendChild(a2);
    a2.click();
    document.body.removeChild(a2);
  }
}

// ============================================================
// 5. RENDER (vidrio esmerilado)
// ============================================================
function crearCard(item, tipo) {
  const thumbUrl = item.image || item.thumb || placeholderArt();
  const titulo = item.name || item.title || 'Sin título';
  const artista = item.artist_name || item.author || 'Artista desconocido';

  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML =
    '<div class="card-art"><img loading="lazy" src="' + escapeHtml(thumbUrl) + '" alt=""></div>' +
    (tipo === 'list' ? '' : '<div class="card-title">' + escapeHtml(titulo) + '</div><div class="card-artist">' + escapeHtml(artista) + '</div>');

  const img = card.querySelector('img');
  if (img) img.addEventListener('error', function () { img.src = placeholderArt(); });

  card.title = titulo + ' · ' + artista;
  card.onclick = function () { cargarCancion(item); };
  return card;
}

function renderLista(items, contenedor) {
  contenedor.innerHTML = '';

  items.forEach(function (it) {
    const row = document.createElement('div');
    row.className = 'row-card';

    const img = document.createElement('img');
    img.className = 'row-art';
    img.loading = 'lazy';
    img.alt = '';
    img.src = it.image || it.thumb || placeholderArt();
    img.addEventListener('error', function () { img.src = placeholderArt(); });

    const info = document.createElement('div');
    info.className = 'row-info';

    const tituloEl = document.createElement('div');
    tituloEl.className = 'row-title';
    tituloEl.textContent = it.name || it.title || 'Sin título';

    const artistaEl = document.createElement('div');
    artistaEl.className = 'row-artist';
    artistaEl.textContent = it.artist_name || it.artist || 'Artista desconocido';

    const tag = document.createElement('span');
    tag.className = 'row-tag' + (it.completa ? ' full' : '');
    tag.textContent = it.completa ? 'COMPLETA' : 'PREVIEW 30s';

    info.appendChild(tituloEl);
    info.appendChild(artistaEl);
    info.appendChild(tag);

    row.appendChild(img);
    row.appendChild(info);
    row.onclick = function () { cargarCancion(it); };
    contenedor.appendChild(row);
  });
}

function renderizar(items, fuentes) {
  if (!resultsEl) return;
  resultsEl.innerHTML = '';

  const toast = document.createElement('p');
  toast.className = 'fuente-toast';
  const origen = (fuentes && fuentes.length) ? fuentes.join(' + ') : 'extensiones';
  toast.textContent = '♪ ' + items.length + ' resultados · ' + origen + ' · audio completo automático';
  resultsEl.appendChild(toast);

  items.forEach(function (it) {
    resultsEl.appendChild(crearCard(it, 'list'));
  });
}

// ---------- Inicio: catálogos declarados por las extensiones ----------
async function cargarInicio() {
  await asegurarExtensiones();

  setEstado(carouselNow, 'Cargando extensiones y portadas…', false);

  let extCatalogo = null;
  const buscadores = extensionesCon('search');
  for (let i = 0; i < buscadores.length; i++) {
    if (buscadores[i].catalogos && buscadores[i].catalogos.length) {
      extCatalogo = buscadores[i];
      break;
    }
  }

  if (!extCatalogo) {
    setEstado(carouselNow, 'Ninguna extensión declaró catálogos de inicio.', true);
    return;
  }

  const opciones = { limit: 12, quality: quality };
  const terminos = extCatalogo.catalogos;
  const resultados = await Promise.all(terminos.map(function (t) {
    return aResultado(extCatalogo.search(t, opciones));
  }));

  carouselNow.innerHTML = '';
  gridAlbums.innerHTML = '';

  let total = 0;
  resultados.forEach(function (r, idx) {
    if (!r.ok || !r.valor || !r.valor.length) return;
    const destino = (idx === 0) ? carouselNow : gridAlbums;
    const tipo = (idx === 0) ? 'carousel' : 'grid';
    r.valor.forEach(function (it) {
      total += 1;
      destino.appendChild(crearCard(it, tipo));
    });
  });

  if (total === 0) {
    setEstado(carouselNow, 'Catálogos sin resultados (revisa la conexión).', true);
    return;
  }

  inicioCargado = true;
}

// ---------- Explorar ----------
function pintarChips() {
  const generos = [];
  const extensiones = listarExtensiones();

  for (let i = 0; i < extensiones.length; i++) {
    const listaExt = extensiones[i].generos || [];
    for (let j = 0; j < listaExt.length; j++) {
      if (generos.indexOf(listaExt[j]) === -1) generos.push(listaExt[j]);
    }
  }

  const lista = generos.length ? generos : GENEROS_RESPALDO;
  chipsEl.innerHTML = '';

  lista.forEach(function (g) {
    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'chip' + (generoActivo === g ? ' chip-active' : '');
    chip.textContent = g;
    chip.onclick = function () { explorarGenero(g); };
    chipsEl.appendChild(chip);
  });
}

async function explorarGenero(g) {
  generoActivo = g;
  pintarChips();
  exploreGrid.innerHTML = '';
  setEstado(exploreMsg, 'Cargando «' + g + '»…', false);

  try {
    await asegurarExtensiones();
    const res = await buscarEnExtensiones(g, 24);

    exploreMsg.innerHTML = '';
    if (res.items.length === 0) {
      setEstado(exploreMsg, 'Sin resultados para «' + g + '».', false);
      return;
    }

    res.items.forEach(function (it) {
      exploreGrid.appendChild(crearCard(it, 'grid'));
    });
  } catch (err) {
    setEstado(exploreMsg, 'Error: ' + ((err && err.message) || String(err)), true);
  }
}

// ---------- Biblioteca ----------
function renderBiblio() {
  const hist = cargarHistorial();
  biblioGrid.innerHTML = '';

  if (hist.length === 0) {
    setEstado(biblioMsg, 'Todavía no hay canciones recientes. Reproduce una y aparecerá aquí.', false);
    return;
  }

  biblioMsg.innerHTML = '';
  renderLista(hist, biblioGrid);
}

// ---------- Pestañas ----------
function switchTab(tab) {
  ['inicio', 'explorar', 'biblio', 'buscar'].forEach(function (t) {
    const v = $id('view-' + t);
    if (v) v.style.display = (t === tab) ? 'block' : 'none';
  });

  tabBar.querySelectorAll('.tab').forEach(function (b) {
    b.classList.toggle('active', b.dataset.tab === tab);
  });

  if (tab === 'inicio' && !inicioCargado) cargarInicio();
  if (tab === 'biblio') renderBiblio();
  if (tab === 'buscar') searchInput.focus();
}

// ---------- Búsqueda: consulta despachada a las extensiones ----------
async function buscar(q) {
  switchTab('buscar');

  resultsEl.innerHTML = '';
  const log = document.createElement('p');
  log.className = 'log-line';
  log.textContent = '[LOG] El botón reacciona. Consultando ' + extensionesCon('search').length + ' extensión(es)…';
  resultsEl.appendChild(log);

  try {
    await asegurarExtensiones();
    const res = await buscarEnExtensiones(q, 20);

    if (res.items.length === 0) {
      setEstado(resultsEl, 'No se encontraron canciones para «' + q + '»', false);
      return;
    }

    renderizar(res.items, res.fuentes);
  } catch (err) {
    setEstado(resultsEl, 'Error: ' + ((err && err.message) || String(err)), true);
  }
}

// ---------- Configuración ----------
function abrirConfig() { aplicarCalidadUI(); configPanel.style.display = 'flex'; }

function cerrarConfig() { configPanel.style.display = 'none'; }

function aplicarCalidadUI() {
  q128Btn.classList.toggle('opt-active', quality === '128');
  q256Btn.classList.toggle('opt-active', quality === '256');
}

function setQuality(q) {
  quality = q;
  localStorage.setItem('sonicyt-quality', q);
  aplicarCalidadUI();
  cerrarConfig();
}

// ============================================================
// 6. INICIALIZACIÓN
// ============================================================
function initControles() {
  tabBar.addEventListener('click', function (e) {
    const b = e.target.closest('.tab');
    if (b) switchTab(b.dataset.tab);
  });

  btnPlayPause.addEventListener('click', function (e) {
    e.stopPropagation();
    if (!currentSong) return;
    if (audio.paused) { audio.play().catch(function () {}); } else { audio.pause(); }
  });

  playerBar.addEventListener('click', function (e) {
    if (e.target === btnPlayPause || btnPlayPause.contains(e.target)) return;
    abrirNowPlaying();
  });

  btnNpClose.onclick = cerrarNowPlaying;
  btnNpPlay.onclick = function () {
    if (!currentSong) return;
    if (audio.paused) { audio.play().catch(function () {}); } else { audio.pause(); }
  };
  btnNpPrev.onclick = function () {
    if (audio.duration) audio.currentTime = Math.max(0, audio.currentTime - 10);
  };
  btnNpNext.onclick = function () {
    if (audio.duration) audio.currentTime = Math.min(audio.duration, audio.currentTime + 10);
  };
  btnNpDownload.onclick = descargarCancion;
  npVol.oninput = function () { audio.volume = npVol.value / 100; };

  audio.addEventListener('play', refreshPlayIcons);
  audio.addEventListener('pause', refreshPlayIcons);
  audio.addEventListener('timeupdate', function () {
    if (audio.duration) {
      npProgress.max = audio.duration;
      npProgress.value = audio.currentTime;
    }
    npTimeCur.textContent = fmtTime(audio.currentTime);
    npTimeDur.textContent = fmtTime(audio.duration);
  });
  npProgress.oninput = function () {
    if (audio.duration) audio.currentTime = npProgress.value;
  };

  btnConfig.onclick = abrirConfig;
  btnCloseConfig.onclick = cerrarConfig;
  q128Btn.onclick = function () { setQuality('128'); };
  q256Btn.onclick = function () { setQuality('256'); };

  btnClearHistory.onclick = function () {
    localStorage.removeItem(HIST_KEY);
    localStorage.removeItem(HIST_KEY_LEGACY);
    renderBiblio();
  };

  searchBtn.onclick = function () {
    const q = searchInput.value.trim();
    if (q) buscar(q);
  };
  searchInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      const q = searchInput.value.trim();
      if (q) buscar(q);
    }
  });
}

function initSW() {
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(function (err) {
      console.error('Error al registrar SW:', err);
    });
  }
}

async function arrancar() {
  promesaExtensiones = cargarExtensiones();
  await promesaExtensiones;

  pintarChips();          // los géneros vienen de las extensiones
  switchTab('inicio');    // dispara cargarInicio() con los catálogos ya cargados
}

document.addEventListener('DOMContentLoaded', function () {
  obtenerElementos();
  initControles();
  initSW();
  aplicarCalidadUI();
  refreshPlayIcons();
  pintarChips();          // respaldo inmediato mientras cargan las extensiones
  arrancar();
});
  </script>
