<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d0d12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sonicyt">
  <meta name="description" content="Reproductor de música PWA estilo Apple Music">
  <title>Sonicyt</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <h1 class="app-title">Sonicyt</h1>
      <button id="btnConfig" class="gear" type="button" aria-label="Configuración">⚙️</button>
    </header>

    <main class="main">

      <!-- ===== VISTA INICIO ===== -->
      <section class="view" id="view-inicio">
        <h2 class="section-title">Escuchar ahora</h2>
        <div class="carousel" id="carouselNow"></div>
        <h2 class="section-title">Álbumes y sencillos</h2>
        <div class="grid" id="gridAlbums"></div>
      </section>

      <!-- ===== VISTA EXPLORAR ===== -->
      <section class="view" id="view-explorar" style="display:none;">
        <h2 class="section-title">Catálogos</h2>
        <div class="chips" id="chips"></div>
        <div class="grid" id="exploreGrid"></div>
        <p class="estado" id="exploreMsg"></p>
      </section>

      <!-- ===== VISTA BIBLIOTECA ===== -->
      <section class="view" id="view-biblio" style="display:none;">
        <div class="biblio-head">
          <h2 class="section-title" style="margin-top:0;">Vuelve a escucharlo · Recientes</h2>
          <button id="btnClearHistory" class="mini-btn" type="button">Vaciar</button>
        </div>
        <div class="list" id="biblioGrid"></div>
        <p class="estado" id="biblioMsg"></p>
      </section>

      <!-- ===== VISTA BUSCAR ===== -->
      <section class="view" id="view-buscar" style="display:none;">
        <div class="search-wrapper">
          <input type="search" id="search" placeholder="Canción, artista o género…" autocomplete="off" spellcheck="false" autocapitalize="none">
          <button id="search-btn" type="button">Buscar</button>
        </div>
        <div id="results"></div>
      </section>
    </main>
  </div>

  <!-- ===== REPRODUCTOR MINI ===== -->
  <div class="player-bar" id="playerBar" style="display:none;" aria-label="Reproductor">
    <img id="playerThumb" src="" alt="">
    <div class="mini-info">
      <div id="playerTitle" class="player-title"></div>
      <div id="playerArtist" class="player-artist"></div>
    </div>
    <button id="btnPlayPause" type="button" class="btn-play-pause" aria-label="Reproducir/Pausar"></button>
  </div>

  <!-- ===== REPRODUCTOR PANTALLA COMPLETA ===== -->
  <div class="now-playing" id="nowPlaying" style="display:none;">
    <img id="npBackdrop" src="" alt="">
    <div class="np-scrim"></div>
    <button id="btnNpClose" type="button" class="np-close" aria-label="Cerrar">
      <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20"><path d="M7 10l5 5 5-5H7z"/></svg>
    </button>
    <span id="npBadge" class="np-badge" style="display:none;"></span>
    <div class="np-art-wrap">
      <img id="npArt" src="" alt="Carátula">
    </div>
    <div id="npTitle" class="np-title"></div>
    <div id="npArtist" class="np-artist"></div>
    <input type="range" id="npProgress" min="0" max="100" value="0">
    <div class="np-times"><span id="npTimeCur">0:00</span><span id="npTimeDur">0:00</span></div>
    <div class="np-controls">
      <button id="btnNpPrev" type="button" class="np-side" aria-label="10s atrás">
        <svg viewBox="0 0 24 24" fill="currentColor" width="24" height="24"><path d="M3.5 12l9-6v12l-9-6zm9 0l9-6v12l-9-6z"/></svg>
      </button>
      <button id="btnNpPlay" type="button" class="np-play" aria-label="Reproducir/Pausar"></button>
      <button id="btnNpNext" type="button" class="np-side" aria-label="10s adelante">
        <svg viewBox="0 0 24 24" fill="currentColor" width="24" height="24"><path d="M20.5 12l-9 6V6l9 6zm-9 0l-9 6V6l9 6z"/></svg>
      </button>
    </div>
    <div class="np-vol">
      <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16"><path d="M3 10v4h4l5 5V5L7 10H3zm13.5 2a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg>
      <input type="range" id="npVol" min="0" max="100" value="100">
      <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16"><path d="M3 10v4h4l5 5V5L7 10H3zm13.5 2A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.23v2.06a7 7 0 0 1 0 13.42v2.06a9 9 0 0 0 0-17.54z"/></svg>
    </div>
    <button id="btnNpDownload" type="button" class="np-download">
      <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16"><path d="M5 20h14v-2H5v2zM12 3l-6 7h4v6h4v-6h4l-6-7z"/></svg>
      <span id="btnNpDownloadText">Descargar audio</span>
    </button>
    <p class="np-dl-status" id="npDownloadStatus"></p>
  </div>

  <!-- ===== PANEL DE CONFIGURACIÓN ===== -->
  <div class="config-panel" id="configPanel" style="display:none;">
    <button id="btnCloseConfig" type="button" class="np-close" aria-label="Cerrar config">
      <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M19 6.4L17.6 5 12 10.6 6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12z"/></svg>
    </button>
    <h3>Configuración</h3>
    <p class="cfg-label">Calidad de imágenes y streaming</p>
    <button id="q128" type="button" class="cfg-opt">Estándar (128 kbps)</button>
    <button id="q256" type="button" class="cfg-opt">Alta Calidad (256 kbps)</button>
    <p class="cfg-note">128: portadas 300 px y preloads ligeros. 256: portadas 600 px, precarga máxima y prioriza el audio completo si está disponible.</p>
  </div>

  <!-- ===== BARRA DE PESTAÑAS ===== -->
  <nav class="tab-bar" id="tabBar">
    <button class="tab active" data-tab="inicio" id="tab-inicio" type="button"><span class="tab-icon">🏠</span><span class="tab-label">Inicio</span></button>
    <button class="tab" data-tab="explorar" id="tab-explorar" type="button"><span class="tab-icon">📚</span><span class="tab-label">Explorar</span></button>
    <button class="tab" data-tab="biblio" id="tab-biblio" type="button"><span class="tab-icon">🕘</span><span class="tab-label">Biblioteca</span></button>
    <button class="tab" data-tab="buscar" id="tab-buscar" type="button"><span class="tab-icon">🔍</span><span class="tab-label">Buscar</span></button>
  </nav>

  <script>
/* ============================================================
   Sonicyt — Hybrid Engine v6
   Motor VISUAL: iTunes Search API (portadas reales 600px)
   Audio COMPLETO: fusión invisible en segundo plano vía
   Invidious (sin cookies) con ventana de 3 segundos.
   Si la fusión no responde, suena el preview de 30 s de
   iTunes automáticamente: nunca se corta ni muestra errores.
   ============================================================ */

const ITUNES_API = 'https://itunes.apple.com/search?media=music&entity=song&limit=20&term=';
const INVIDIOUS_INSTANCES = ['https://tux.digital', 'https://projectsegfau.lt', 'https://yewtu.be'];
const TIEMPO_FUSION_MS = 3000;
const CATALOGO_INICIO = ['Pop', 'Electronic', 'Lofi'];
const GENEROS = ['Pop', 'Rock', 'Electronic', 'Lofi', 'Jazz', 'Hip-Hop', 'Reggaetón', 'Salsa', 'Metal', 'K-Pop', 'Clásica', 'Bossanova'];

// ---------- Modelo DOM ----------
let searchInput, searchBtn, resultsEl;
let audio, playerBar, playerThumb, playerTitle, playerArtist, btnPlayPause;
let nowPlaying, npBackdrop, npArt, npTitle, npArtist, npBadge, npProgress, npTimeCur, npTimeDur;
let btnNpPrev, btnNpPlay, btnNpNext, btnNpDownload, btnNpDownloadText, npDownloadStatus, npVol, btnNpClose;
let btnConfig, configPanel, btnCloseConfig, q128Btn, q256Btn;
let tabBar, carouselNow, gridAlbums, chipsEl, exploreGrid, exploreMsg, biblioGrid, biblioMsg, btnClearHistory;

let currentSong = null;
let quality = localStorage.getItem('sonicyt-quality') || '256';
let inicioCargado = false;
let generoActivo = null;
let fusionController = null;

const SVG_PLAY = '<svg viewBox="0 0 24 24" fill="currentColor" width="26" height="26"><path d="M8 5v14l11-7z"/></svg>';
const SVG_PAUSE = '<svg viewBox="0 0 24 24" fill="currentColor" width="26" height="26"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';
const SVG_DL_FULL = '<svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16"><path d="M5 20h14v-2H5v2zM12 3l-6 7h4v6h4v-6h4l-6-7z"/></svg>';

function $id(id) { return document.getElementById(id); }

function obtenerElementos() {
  searchInput = $id('search');
  searchBtn = $id('search-btn');
  resultsEl = $id('results');

  audio = new Audio();
  audio.preload = 'auto';

  playerBar = $id('playerBar');
  playerThumb = $id('playerThumb');
  playerTitle = $id('playerTitle');
  playerArtist = $id('playerArtist');
  btnPlayPause = $id('btnPlayPause');

  nowPlaying = $id('nowPlaying');
  npBackdrop = $id('npBackdrop');
  npArt = $id('npArt');
  npTitle = $id('npTitle');
  npArtist = $id('npArtist');
  npBadge = $id('npBadge');
  npProgress = $id('npProgress');
  npTimeCur = $id('npTimeCur');
  npTimeDur = $id('npTimeDur');
  btnNpPrev = $id('btnNpPrev');
  btnNpPlay = $id('btnNpPlay');
  btnNpNext = $id('btnNpNext');
  btnNpDownload = $id('btnNpDownload');
  btnNpDownloadText = $id('btnNpDownloadText');
  npDownloadStatus = $id('npDownloadStatus');
  npVol = $id('npVol');
  btnNpClose = $id('btnNpClose');

  btnConfig = $id('btnConfig');
  configPanel = $id('configPanel');
  btnCloseConfig = $id('btnCloseConfig');
  q128Btn = $id('q128');
  q256Btn = $id('q256');

  tabBar = $id('tabBar');
  carouselNow = $id('carouselNow');
  gridAlbums = $id('gridAlbums');
  chipsEl = $id('chips');
  exploreGrid = $id('exploreGrid');
  exploreMsg = $id('exploreMsg');
  biblioGrid = $id('biblioGrid');
  biblioMsg = $id('biblioMsg');
  btnClearHistory = $id('btnClearHistory');
}

// ---------- Utilidades ----------
function fmtTime(seconds) {
  if (!seconds || isNaN(seconds)) return '0:00';
  const m = Math.floor(seconds / 60);
  const s = Math.floor(seconds % 60);
  return m + ':' + (s < 10 ? '0' : '') + s;
}

function escapeHtml(text) {
  if (!text) return '';
  const d = document.createElement('div');
  d.textContent = text;
  return d.innerHTML;
}

function setEstado(el, mensaje, esError) {
  if (!el) return;
  el.innerHTML = '';
  const p = document.createElement('p');
  p.style.textAlign = 'center';
  p.style.marginTop = '36px';
  p.style.fontSize = '15px';
  p.style.color = esError ? '#ff6b6b' : 'rgba(255,255,255,0.62)';
  p.textContent = mensaje;
  el.appendChild(p);
}

function iconName(btn, name) {
  btn.innerHTML = (name === 'pause') ? SVG_PAUSE : SVG_PLAY;
}

function sanearNombre(texto) {
  return (texto || 'Audio').replace(/[\\/:*?"<>|]/g, '').slice(0, 100);
}

function artworkSize() {
  return quality === '256' ? '600x600' : '300x300';
}

function actualizacionBadge() {
  if (!currentSong) return;
  if (currentSong.completa) {
    npBadge.textContent = '● PISTA COMPLETA · MP3';
    npBadge.style.display = 'block';
    btnNpDownloadText.textContent = 'Descargar audio completo';
  } else {
    npBadge.textContent = '● PREVIEW · 30 s';
    npBadge.style.display = 'block';
    btnNpDownloadText.textContent = 'Descargar preview';
  }
}

// ---------- Historial (localStorage) ----------
function cargarHistorial() {
  try {
    return JSON.parse(localStorage.getItem('sonicyt-historial-v6') || '[]');
  } catch (e) {
    return [];
  }
}

function agregarAHistorial(song) {
  let hist = cargarHistorial().filter(function (t) { return t.id !== song.id; });
  hist.unshift(song);
  hist = hist.slice(0, 50);
  localStorage.setItem('sonicyt-historial-v6', JSON.stringify(hist));
}

// ---------- Mapeo iTunes → modelo visual ----------
function mapeariTunes(t) {
  const img = t.artworkUrl100 ? t.artworkUrl100.replace('100x100bb', artworkSize() + 'bb') : '';
  return {
    id: 'it-' + t.trackId,
    name: t.trackName,
    artist_name: t.artistName,
    image: img,
    audio: t.previewUrl,
    completa: false
  };
}

// ---------- Fetch de catálogos iTunes (visual, instantáneo) ----------
async function fetchItunes(term, limite) {
  const limiteEfactivo = limite || 12;
  const res = await fetch(ITUNES_API + encodeURIComponent(term) + '&limit=' + limiteEfactivo, { mode: 'cors' });
  if (!res.ok) throw new Error('HTTP ' + res.status + ' en iTunes: ' + term);
  const data = await res.json();
  return (data.results || []).map(mapeariTunes);
}

// ---------- FUSIÓN INVISIBLE: audio completo vía Invidious (sin cookies) ----------
function cancelarFusion() {
  if (fusionController) {
    fusionController.abort();
    fusionController = null;
  }
}

async function fusionCancionCompleta(artistName, songName) {
  cancelarFusion();
  const controller = new AbortController();
  fusionController = controller;
  const timer = setTimeout(function () { controller.abort(); }, TIEMPO_FUSION_MS);

  try {
    // Paso 1: buscar el videoId en Invidious usando artista + título
    let videoId = null;
    for (let i = 0; i < INVIDIOUS_INSTANCES.length; i++) {
      const instancia = INVIDIOUS_INSTANCES[i];
      try {
        const res = await fetch(instancia + '/api/v1/search?q=' + encodeURIComponent(artistName + ' ' + songName) + '&type=video', {
          mode: 'cors', signal: controller.signal
        });
        if (!res.ok) continue;
        const data = await res.json();
        if (data && data.length > 0) { videoId = data[0].videoId; break; }
      } catch (e) {
        if (e.name === 'AbortError') throw e;
        continue;
      }
    }
    if (!videoId) throw new Error('Invidious sin resultados');

    // Paso 2: extraer el stream itag=140 del video
    for (let i = 0; i < INVIDIOUS_INSTANCES.length; i++) {
      const instancia = INVIDIOUS_INSTANCES[i];
      try {
        const res = await fetch(instancia + '/api/v1/videos/' + videoId, {
          mode: 'cors', signal: controller.signal
        });
        if (!res.ok) continue;
        const vid = await res.json();
        const formats = vid.adaptiveFormats || [];
        const f = formats.find(function (x) {
          return x.itag === 140 || (x.contentType && x.contentType.startsWith('audio/'));
        });
        if (f && f.url) {
          return f.url;
        }
      } catch (e) {
        if (e.name === 'AbortError') throw e;
        continue;
      }
    }
    throw new Error('Sin itag=140');
  } catch (err) {
    throw err;
  } finally {
    clearTimeout(timer);
    fusionController = null;
  }
}

// ---------- Cambio de stream sin cortes (swap continuo) ----------
function cambiarStreamSinCortes(urlCompleto) {
  const posicion = audio.currentTime || 0;
  const estabaSonando = !audio.paused;
  audio.src = urlCompleto;
  audio.addEventListener('loadedmetadata', function alFetch() {
    try { audio.currentTime = posicion; } catch (e) { /* algunos navegadores */ }
    audio.removeEventListener('loadedmetadata', alFetch);
  });
  if (estabaSonando) audio.play().catch(function () {});
  currentSong.url = urlCompleto;
  currentSong.completa = true;
  actualizacionBadge();
  agregarAHistorial(currentSong);
  npDownloadStatus.textContent = 'Audio completo cargado sin cortes ✔';
}

// ---------- Reproductor ----------
function reproducirPreview(item) {
  currentSong = {
    id: item.id || 'it-' + Math.floor(Math.random() * 1e10),
    title: item.name || item.title || 'Sin título',
    artist: item.artist_name || item.author || 'Artista desconocido',
    thumb: item.image || '',
    url: item.audio || item.url || null,
    // Historial sin campo audio: la URL guardada ya es la pista resuelta (completa o preview)
    completa: !item.audio && item.completa === true
  };
  audio.src = currentSong.url;
  audio.play().catch(function () { /* autoplay bloqueado */ });
  actualizarReproductorMini();
  abrirNowPlaying();
  agregarAHistorial(currentSong);
}

async function cargarCancion(item) {
  if (!item || !(item.audio || item.videoId || item.url)) {
    setEstado(resultsEl, 'Esta tarjeta no tiene audio reproducible.', false);
    return;
  }

  cancelarFusion();

  // 1) SONAR AL INSTANTE con el preview de iTunes (nunca bloquear el usuario)
  reproducirPreview(item);

  // 2) FUSIÓN INVISIBLE: intentar el MP3 completo en segundo plano (ventana de 3 s)
  const artist = item.artist_name || item.author || '';
  const song = item.name || item.title || '';
  fusionCancionCompleta(artist, song).then(function (urlCompleto) {
    // Llegó antes de los 3 s → swap continuo a la pista completa
    if (currentSong) cambiarStreamSinCortes(urlCompleto);
  }).catch(function () {
    // No respondió a tiempo o Invidious caído: el preview sigue sonando, sin errores
  });
}

function actualizarReproductorMini() {
  if (!currentSong) return;
  playerBar.style.display = 'flex';
  playerThumb.src = currentSong.thumb;
  playerTitle.textContent = currentSong.title;
  playerArtist.textContent = currentSong.artist;
  refreshPlayIcons();
}

function refreshPlayIcons() {
  const ico = audio.paused ? 'play' : 'pause';
  iconName(btnPlayPause, ico);
  iconName(btnNpPlay, ico);
}

function abrirNowPlaying() {
  if (!currentSong) return;
  npBackdrop.src = currentSong.thumb;
  npArt.src = currentSong.thumb;
  npTitle.textContent = currentSong.title;
  npArtist.textContent = currentSong.artist;
  nowPlaying.style.display = 'flex';
  npDownloadStatus.textContent = '';
  actualizacionBadge();
  refreshPlayIcons();
}

function cerrarNowPlaying() {
  nowPlaying.style.display = 'none';
}

// ---------- Descarga nativa ----------
async function descargarCancion() {
  if (!currentSong || !currentSong.url) return;
  npDownloadStatus.textContent = 'Descargando…';
  try {
    const res = await fetch(currentSong.url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const blob = await res.blob();
    const ext = (currentSong.completa) ? 'mp3' : ((blob.type && blob.type.indexOf('mpeg') !== -1) ? 'mp3' : 'm4a');
    const nombre = sanearNombre(currentSong.artist + ' - ' + currentSong.title) + '.' + ext;
    const urlBlob = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = urlBlob;
    a.download = nombre;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(urlBlob); }, 4000);
    npDownloadStatus.textContent = 'Guardado en tu carpeta de Descargas ✔ (' + Math.round(blob.size / 1024) + ' KB)';
  } catch (err) {
    npDownloadStatus.textContent = 'Descarga nativa abierta…';
    const a2 = document.createElement('a');
    a2.href = currentSong.url;
    a2.target = '_blank';
    a2.rel = 'noopener';
    document.body.appendChild(a2);
    a2.click();
    document.body.removeChild(a2);
  }
}

// ---------- Render visual ----------
function crearCard(item, tipo) {
  const thumbUrl = item.image || ('data:image/svg+xml;utf8,' + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300"><rect width="300" height="300" fill="#161622"/><text x="150" y="178" font-size="72" text-anchor="middle" fill="#1DB954" font-family="sans-serif">&#9834;</text></svg>'
  ));
  const titulo = item.name || item.title || 'Sin título';
  const artista = item.artist_name || item.author || 'Artista desconocido';

  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML =
    '<div class="card-art"><img loading="lazy" src="' + escapeHtml(thumbUrl) + '" alt=""></div>' +
    (tipo === 'list' ? '' : '<div class="card-title">' + escapeHtml(titulo) + '</div><div class="card-artist">' + escapeHtml(artista) + '</div>');
  card.title = titulo + ' · ' + artista;
  card.onclick = function () { cargarCancion(item); };
  return card;
}

function renderLista(items, contenedor) {
  contenedor.innerHTML = '';
  items.forEach(function (it) {
    const row = document.createElement('div');
    row.className = 'row-card';
    row.innerHTML =
      '<img class="row-art" loading="lazy" src="' + escapeHtml(it.image || '') + '" alt="">' +
      '<div class="row-info">' +
      '<div class="row-title">' + escapeHtml(it.name || it.title || '') + '</div>' +
      '<div class="row-artist">' + escapeHtml(it.artist_name || it.author || '') + '</div>' +
      '</div>';
    row.onclick = function () { cargarCancion(it); };
    contenedor.appendChild(row);
  });
}

function renderizar(items) {
  if (!resultsEl) return;
  resultsEl.innerHTML = '';
  const toast = document.createElement('p');
  toast.className = 'fuente-toast';
  toast.textContent = '♪ Portadas y metadatos por iTunes · audio completo cuando esté disponible';
  resultsEl.appendChild(toast);
  items.forEach(function (it) {
    resultsEl.appendChild(crearCard(it, 'list'));
  });
}

// ---------- Inicio: catálogos iTunes instantáneos ----------
async function cargarInicio() {
  setEstado(carouselNow, 'Cargando portadas…', false);
  try {
    const promises = CATALOGO_INICIO.map(function (t) { return fetchItunes(t); });
    const [pop, electronic, lofi] = await Promise.all(promises);
    carouselNow.innerHTML = '';
    pop.forEach(function (it) { carouselNow.appendChild(crearCard(it, 'carousel')); });
    gridAlbums.innerHTML = '';
    electronic.forEach(function (it) { gridAlbums.appendChild(crearCard(it, 'grid')); });
    lofi.forEach(function (it) { gridAlbums.appendChild(crearCard(it, 'grid')); });
    if (pop.length === 0) setEstado(carouselNow, 'iTunes no respondió con resultados.', false);
    inicioCargado = true;
  } catch (err) {
    setEstado(carouselNow, 'Error cargando catálogos: ' + err.message, true);
  }
}

// ---------- Explorar ----------
function pintarChips() {
  chipsEl.innerHTML = '';
  GENEROS.forEach(function (g) {
    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'chip' + (generoActivo === g ? ' chip-active' : '');
    chip.textContent = g;
    chip.onclick = function () { explorarGenero(g); };
    chipsEl.appendChild(chip);
  });
}

async function explorarGenero(g) {
  generoActivo = g;
  pintarChips();
  exploreGrid.innerHTML = '';
  setEstado(exploreMsg, 'Cargando «' + g + '»…', false);
  try {
    const items = await fetchItunes(g);
    exploreMsg.innerHTML = '';
    if (items.length === 0) {
      setEstado(exploreMsg, 'Sin resultados para «' + g + '».', false);
      return;
    }
    items.forEach(function (it) { exploreGrid.appendChild(crearCard(it, 'grid')); });
  } catch (err) {
    setEstado(exploreMsg, 'Error: ' + err.message, true);
  }
}

// ---------- Biblioteca ----------
function renderBiblio() {
  const hist = cargarHistorial();
  biblioGrid.innerHTML = '';
  if (hist.length === 0) {
    setEstado(biblioMsg, 'Todavía no hay canciones recientes. Reproduce una y aparecerá aquí.', false);
    return;
  }
  biblioMsg.innerHTML = '';
  renderLista(hist, biblioGrid);
}

// ---------- Pestañas ----------
function switchTab(tab) {
  ['inicio', 'explorar', 'biblio', 'buscar'].forEach(function (t) {
    const v = $id('view-' + t);
    if (v) v.style.display = (t === tab) ? 'block' : 'none';
  });
  tabBar.querySelectorAll('.tab').forEach(function (b) {
    b.classList.toggle('active', b.dataset.tab === tab);
  });
  if (tab === 'inicio' && !inicioCargado) cargarInicio();
  if (tab === 'biblio') renderBiblio();
  if (tab === 'buscar') searchInput.focus();
}

// ---------- Búsqueda (pestaña Buscar) ----------
async function buscar(q) {
  switchTab('buscar');
  document.getElementById('results').innerHTML = '<p style="color: #1DB954; text-align: center; font-weight: bold;">[LOG] El botón reacciona. Buscando en iTunes…</p>';

  try {
    const items = await fetchItunes(q, 20);
    if (items.length === 0) {
      setEstado(resultsEl, 'No se encontraron canciones para «' + q + '»', false);
      return;
    }
    renderizar(items);
  } catch (err) {
    const detalle = (err && err.message) ? err.message : String(err);
    setEstado(resultsEl, 'Error: ' + detalle, true);
  }
}

// ---------- Configuración ----------
function abrirConfig() { aplicarCalidadUI(); configPanel.style.display = 'flex'; }

function cerrarConfig() { configPanel.style.display = 'none'; }

function aplicarCalidadUI() {
  q128Btn.classList.toggle('opt-active', quality === '128');
  q256Btn.classList.toggle('opt-active', quality === '256');
}

function setQuality(q) {
  quality = q;
  localStorage.setItem('sonicyt-quality', q);
  aplicarCalidadUI();
  cerrarConfig();
}

// ---------- Inicialización ----------
function initControles() {
  tabBar.addEventListener('click', function (e) {
    const b = e.target.closest('.tab');
    if (b) switchTab(b.dataset.tab);
  });

  btnPlayPause.addEventListener('click', function (e) {
    e.stopPropagation();
    if (!currentSong) return;
    if (audio.paused) { audio.play().catch(function () {}); } else { audio.pause(); }
  });

  playerBar.addEventListener('click', function (e) {
    if (e.target === btnPlayPause || btnPlayPause.contains(e.target)) return;
    abrirNowPlaying();
  });

  btnNpClose.onclick = cerrarNowPlaying;
  btnNpPlay.onclick = function () {
    if (!currentSong) return;
    if (audio.paused) { audio.play().catch(function () {}); } else { audio.pause(); }
  };
  btnNpPrev.onclick = function () {
    if (audio.duration) audio.currentTime = Math.max(0, audio.currentTime - 10);
  };
  btnNpNext.onclick = function () {
    if (audio.duration) audio.currentTime = Math.min(audio.duration, audio.currentTime + 10);
  };
  btnNpDownload.onclick = descargarCancion;
  npVol.oninput = function () { audio.volume = npVol.value / 100; };

  audio.addEventListener('play', refreshPlayIcons);
  audio.addEventListener('pause', refreshPlayIcons);
  audio.addEventListener('timeupdate', function () {
    if (audio.duration) {
      npProgress.max = audio.duration;
      npProgress.value = audio.currentTime;
    }
    npTimeCur.textContent = fmtTime(audio.currentTime);
    npTimeDur.textContent = fmtTime(audio.duration);
  });
  npProgress.oninput = function () {
    if (audio.duration) audio.currentTime = npProgress.value;
  };

  btnConfig.onclick = abrirConfig;
  btnCloseConfig.onclick = cerrarConfig;
  q128Btn.onclick = function () { setQuality('128'); };
  q256Btn.onclick = function () { setQuality('256'); };

  btnClearHistory.onclick = function () {
    localStorage.removeItem('sonicyt-historial-v6');
    renderBiblio();
  };

  searchBtn.onclick = function () {
    const q = searchInput.value.trim();
    if (q) buscar(q);
  };
  searchInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      const q = searchInput.value.trim();
      if (q) buscar(q);
    }
  });
}

function initSW() {
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(function (err) {
      console.error('Error al registrar SW:', err);
    });
  }
}

document.addEventListener('DOMContentLoaded', function () {
  obtenerElementos();
  pintarChips();
  initControles();
  initSW();
  aplicarCalidadUI();
  refreshPlayIcons();
  switchTab('inicio');
});
  </script>
</body>
</html>
