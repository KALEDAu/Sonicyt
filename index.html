<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sonicyt">
  <meta name="description" content="Reproductor de música PWA con Invidious y Capacitor">
  <title>Sonicyt — Reproductor PWA</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <h1 class="app-title">Sonicyt</h1>
      <div class="search-wrapper">
        <input type="search" id="search" placeholder="Buscar canciones o artistas…" autocomplete="off" spellcheck="false" autocapitalize="none">
        <button id="search-btn" type="button">Buscar</button>
      </div>
    </header>

    <main class="results" id="results" role="list">
      <p style="color: #a3a3a3; text-align: center; margin-top: 60px;">Busca una canción o artista para empezar</p>
    </main>
  </div>

  <div class="player-bar" id="playerBar" style="display:none;" aria-label="Reproductor">
    <div class="player-thumb">
      <img id="playerThumb" src="" alt="Portada">
    </div>
    <div class="player-info">
      <div id="playerTitle" class="player-title">Canción</div>
      <div id="playerArtist" class="player-artist">Artista</div>
    </div>
    <button id="btnPlayPause" type="button" class="btn-play-pause" aria-label="Reproducir/Pausar">▶</button>
    <div class="progress-container">
      <input type="range" id="progressBar" min="0" max="100" value="0" list="tickmarks">
      <datalist id="tickmarks"></datalist>
      <div class="time-labels">
        <span id="timeCurrent">0:00</span>
        <span id="timeDuration">0:00</span>
      </div>
    </div>
  </div>

  <script>
/* ========================================
   Sonicyt — Lógica PWA (Vanilla JS embebida)
   Búsqueda Invidious vía proxy CORS + extracción audio itag=140
   ======================================== */

// ---------- Instancias públicas de Invidious (servidores activos) ----------
const INVIDIOUS_INSTANCES = [
  'https://tux.digital',
  'https://projectsegfau.lt',
  'https://yewtu.be'
];

// ---------- API pública de Jamendo (CORS nativo abierto, música real con MP3 directo) ----------
// Client_id de ejemplos oficiales de la documentación de Jamendo ( developers.jamendo.com )
// Si está suspendido, regístrate gratis en developer.jamendo.com y pon tu propio client_id aquí
const JAMENDO_CLIENT_ID = '56d30c95';
const JAMENDO_API = 'https://api.jamendo.com/v3.0/tracks/?client_id=' + JAMENDO_CLIENT_ID + '&format=json&limit=20&sort=relevance&search=';

// ---------- Búsqueda real alternativa: iTunes Search API (Apple, abierta, sin clave, CORS nativo) ----------
const ITUNES_API = 'https://itunes.apple.com/search?media=music&entity=song&limit=20&term=';

let INVIDIOUS = INVIDIOUS_INSTANCES[0];
let INVIDIOUS_INDEX = 0;

// ---------- Elementos DOM ----------
let searchInput, searchBtn, resultsEl;
let audio, playerBar, playerThumb, playerTitle, playerArtist, btnPlayPause, progressBar, timeCurrent, timeDuration;

function obtenerElementos() {
  searchInput = document.getElementById('search');
  searchBtn = document.getElementById('search-btn');
  resultsEl = document.getElementById('results');

  audio = new Audio();
  audio.preload = 'none';

  playerBar = document.getElementById('playerBar');
  playerThumb = document.getElementById('playerThumb');
  playerTitle = document.getElementById('playerTitle');
  playerArtist = document.getElementById('playerArtist');
  btnPlayPause = document.getElementById('btnPlayPause');
  progressBar = document.getElementById('progressBar');
  timeCurrent = document.getElementById('timeCurrent');
  timeDuration = document.getElementById('timeDuration');
}

let currentSong = null;

function fmtTime(seconds) {
  if (!seconds || isNaN(seconds)) return '0:00';
  const m = Math.floor(seconds / 60);
  const s = Math.floor(seconds % 60);
  return m + ':' + (s < 10 ? '0' : '') + s;
}

function escapeHtml(text) {
  if (!text) return '';
  const d = document.createElement('div');
  d.textContent = text;
  return d.innerHTML;
}

// ---------- Mensaje de estado visual ----------
function setEstado(mensaje, esError = false) {
  if (!resultsEl) return;
  resultsEl.innerHTML = '';
  const p = document.createElement('p');
  p.style.textAlign = 'center';
  p.style.marginTop = '60px';
  p.style.fontSize = '16px';
  p.style.fontWeight = 'bold';
  p.style.color = esError ? '#ff6b6b' : '#1DB954';
  p.textContent = mensaje;
  resultsEl.appendChild(p);
}

// ---------- Búsqueda de música REAL en Jamendo (API abierta con CORS nativo) ----------
async function buscar(q) {
  // PRIMERÍSIMA LÍNEA: mostrar mensaje de conexión al instante
  document.getElementById('results').innerHTML = '<p style="color: #1DB954; text-align: center; font-weight: bold;">[LOG] El botón reacciona. Buscando música real...</p>';

  // Fuente 1: API pública de Jamendo (canciones reales con mp3 directo)
  const urlJamendo = JAMENDO_API + encodeURIComponent(q);

  try {
    const res = await fetch(urlJamendo, { mode: 'cors' });
    if (!res.ok) {
      throw new Error('HTTP ' + res.status + ' desde la API de Jamendo');
    }
    const data = await res.json();
    const resultados = data.results || [];
    if (resultados.length > 0) {
      renderizar(resultados);
      return;
    }
    throw new Error('Jamendo devolvió 0 canciones');
  } catch (errJamendo) {
    console.warn('Jamendo no disponible:', errJamendo.message);

    // Fuente 2 automática: iTunes Search API (open sin clave, CORS nativo, música real)
    const urlItunes = ITUNES_API + encodeURIComponent(q);
    try {
      const resIt = await fetch(urlItunes, { mode: 'cors' });
      if (!resIt.ok) {
        throw new Error('HTTP ' + resIt.status + ' desde iTunes');
      }
      const dataIt = await resIt.json();
      const mapped = (dataIt.results || []).map(function (t) {
        return {
          id: t.trackId,
          name: t.trackName,
          artist_name: t.artistName,
          image: t.artworkUrl100 ? t.artworkUrl100.replace('100x100bb', '600x600bb') : '',
          audio: t.previewUrl
        };
      });
      if (mapped.length === 0) {
        setEstado('No se encontraron canciones para "' + q + '"', false);
        return;
      }
      document.getElementById('results').innerHTML = '<p style="color: #1a8f47; text-align: center; margin-top: 20px;">[LOG] Jamendo no respondió. Resultados vía iTunes Search API (música real).</p>';
      renderizar(mapped);
    } catch (errItunes) {
      // Error exacto en pantalla en rojo
      const detalle = (errItunes && errItunes.message) ? errItunes.message : String(errItunes);
      setEstado('Error: ' + detalle, true);
    }
  }
}

function renderizar(items) {
  if (!resultsEl) return;
  resultsEl.innerHTML = '';
  if (!items || items.length === 0) {
    setEstado('No se encontraron resultados', false);
    return;
  }

  items.forEach(function (it) {
    // Campos reales de Jamendo: name (título), artist_name (artista), image (portada), audio (mp3 directo)
    // Soporte también de formato Invidious (thumbnails[] / title / author)
    const thumbUrl = it.image
      ? it.image
      : (it.thumbnails && it.thumbnails[0] && it.thumbnails[0].url)
        ? it.thumbnails[0].url
        : 'https://via.placeholder.com/320x180.png?text=Audio';
    const titulo = it.name || it.title || 'Sin título';
    const artista = it.artist_name || it.author || 'Artista desconocido';

    const card = document.createElement('div');
    card.className = 'result-card';
    card.innerHTML =
      '<div class="thumb"><img src="' + escapeHtml(thumbUrl) + '" alt=""></div>' +
      '<div class="info">' +
      '<div class="title">' + escapeHtml(titulo) + '</div>' +
      '<div class="artist">' + escapeHtml(artista) + '</div>' +
      '</div>';

    card.onclick = function () {
      cargarCancion(it);
    };

    resultsEl.appendChild(card);
  });
}

// ---------- Cargar canción y extraer audio directo ----------
async function cargarCancion(item) {
  // Jamendo entrega 'audio' con el stream MP3 directo: mandarlo al reproductor al instante
  if (item.audio) {
    currentSong = {
      id: item.id,
      title: item.name || item.title,
      artist: item.artist_name || item.author,
      thumb: item.image || '',
      url: item.audio
    };
    audio.src = currentSong.url;
    await audio.play().catch(function () {
      // Autoplay bloqueado; el usuario pulsará play
    });
    actualizarInterfazReproductor();
    return;
  }

  // Canciones de Invidious: conexión DIRECTA sin proxy a cada instancia
  setEstado('Cargando canción…', false);

  let ultimoError = null;

  for (let i = 0; i < INVIDIOUS_INSTANCES.length; i++) {
    try {
      const instancia = INVIDIOUS_INSTANCES[i];
      const urlInvidious = instancia + '/api/v1/videos/' + item.videoId;

      const res = await fetch(urlInvidious, { mode: 'cors' });
      if (!res.ok) {
        throw new Error('HTTP ' + res.status + ' desde ' + instancia);
      }

      const texto = await res.text();
      let vid;
      try {
        vid = JSON.parse(texto);
      } catch (e) {
        throw new Error('Respuesta no es JSON válido desde ' + instancia);
      }

      let audioUrl = null;
      const formats = vid.adaptiveFormats || [];

      const f = formats.find(function (x) {
        return x.itag === 140 || (x.contentType && x.contentType.startsWith('audio/'));
      });

      if (f && f.url) {
        audioUrl = f.url;
      } else {
        const fs = vid.formatStreams || [];
        const f2 = fs.find(function (x) {
          return x.itag === 140 || (x.type && x.type.includes('audio'));
        });
        if (f2 && f2.url) audioUrl = f2.url;
      }

      if (!audioUrl) throw new Error('No se encontró stream de audio directo (itag=140)');

      // Éxito
      INVIDIOUS = instancia;
      INVIDIOUS_INDEX = i;

      currentSong = {
        id: vid.videoId || item.videoId,
        title: vid.title || item.title,
        artist: vid.author || item.author,
        thumb: (vid.thumbnails && vid.thumbnails[0] && vid.thumbnails[0].url)
          ? vid.thumbnails[0].url
          : (item.thumbnails && item.thumbnails[0] ? item.thumbnails[0].url : ''),
        url: audioUrl
      };

      audio.src = currentSong.url;
      await audio.play().catch(function () {
        // Autoplay bloqueado; el usuario pulsará play
      });

      actualizarInterfazReproductor();
      return;
    } catch (err) {
      ultimoError = err;
      console.warn('Instancia falló para cargar canción:', INVIDIOUS_INSTANCES[i], err.message);
    }
  }

  const detalle = (ultimoError && ultimoError.message) ? ultimoError.message : 'Error desconocido';
  alert('No se pudo reproducir la canción:\nError: ' + detalle);
}

function actualizarInterfazReproductor() {
  if (!currentSong) return;
  if (playerBar) playerBar.style.display = 'flex';
  if (playerThumb) playerThumb.src = currentSong.thumb;
  if (playerTitle) playerTitle.textContent = currentSong.title;
  if (playerArtist) playerArtist.textContent = currentSong.artist;
  if (btnPlayPause) btnPlayPause.textContent = audio.paused ? '▶' : '⏸';
}

// ---------- Controles ----------
function initControles() {
  if (!btnPlayPause || !progressBar || !audio) return;

  btnPlayPause.onclick = function () {
    if (!currentSong) return;
    if (audio.paused) {
      audio.play().catch(function () {});
    } else {
      audio.pause();
    }
  };

  audio.onplay = function () {
    if (btnPlayPause) btnPlayPause.textContent = '⏸';
  };

  audio.onpause = function () {
    if (btnPlayPause) btnPlayPause.textContent = '▶';
  };

  audio.onended = function () {
    if (btnPlayPause) btnPlayPause.textContent = '▶';
  };

  audio.ontimeupdate = function () {
    if (audio.duration && progressBar) {
      progressBar.max = audio.duration;
      progressBar.value = audio.currentTime;
    }
    if (timeCurrent) timeCurrent.textContent = fmtTime(audio.currentTime);
    if (timeDuration) timeDuration.textContent = fmtTime(audio.duration);
  };

  progressBar.oninput = function () {
    if (audio.duration) {
      audio.currentTime = progressBar.value;
    }
  };
}

// ---------- Eventos de búsqueda ----------
function initBusqueda() {
  if (!searchBtn || !searchInput) return;

  searchBtn.onclick = function () {
    const q = searchInput.value.trim();
    if (q) buscar(q);
  };

  searchInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      const q = searchInput.value.trim();
      if (q) buscar(q);
    }
  });
}

// ---------- Registro Service Worker (PWA offline) ----------
function initSW() {
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').then(function (reg) {
      console.log('SW registrado:', reg.scope);
    }).catch(function (err) {
      console.error('Error al registrar SW:', err);
    });
  }
}

// ---------- Inicialización cuando el DOM esté listo ----------
document.addEventListener('DOMContentLoaded', function () {
  obtenerElementos();
  initSW();
  initControles();
  initBusqueda();
});
  </script>
</body>
</html>
